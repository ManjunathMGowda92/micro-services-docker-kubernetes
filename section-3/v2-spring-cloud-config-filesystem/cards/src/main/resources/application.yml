spring:
  application:
    name: cards
  config:
    import:
      - "application-qa.yml"
      - "application-prod.yml"
      - "configserver:http://localhost:8071/"
  profiles:
    active:
      - "qa"

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8090
  servlet:
    context-path: /cards-service


app:
  details:
    name: cards-service
    author: Manjunath
    description: Cards Application
    version: "2.0.0"
    environment: "LOCAL"