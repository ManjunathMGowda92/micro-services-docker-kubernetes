global:
  scrape_interval: 5s  # Set the scrape interval to every 5 seconds
  evaluation_interval: 5s  #Evaluate rules every 5 seconds

scrape_configs:
  - job_name: 'accounts'
    metrics_path: '/accounts-service/actuator/prometheus'
    static_configs:
      - targets: ['accounts:8080']
  - job_name: 'loans'
    metrics_path: '/loans-service/actuator/prometheus'
    static_configs:
      - targets: [ 'loans:9000' ]
  - job_name: 'cards'
    metrics_path: '/cards-service/actuator/prometheus'
    static_configs:
      - targets: [ 'cards:8090' ]
  - job_name: 'gateway-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'gateway-server:9100' ]
  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'discovery-server:8761' ]
  - job_name: 'bank-config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'banking-config-server:8071' ]


