name: banking-services
services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: banking-config-mq
    container_name: banking-rabbit-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      RABBITMQ_DEFAULT_USER: "rabbit_prod"
      RABBITMQ_DEFAULT_PASS: "r@bbItProd!0109"
    extends:
      file: common-config.yml
      service: network-deploy-service

  banking-config-server:
    image: "manjunathgowda1992/banking-config-server:8.0.0" # Specify the image for config-server
    container_name: banking-config-server # Provide container name to avoid random name generation
    ports:
      - "8071:8071"  # Expose the port of container to outside by port mapping
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: # To perform the health check of the container
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s  # mention after how much time of container start the curl need to be executed
    environment: # Environment properties
      SPRING_APPLICATION_NAME: "bank-config-server"
    extends:
      file: common-config.yml
      service: microservice-base-config

  discovery-server:
    image: "manjunathgowda1992/discovery-server:8.0.0"
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      banking-config-server:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "discovery-server"
    extends:
      file: common-config.yml
      service: microservice-config-server

  accounts:
    image: "manjunathgowda1992/accounts:8.0.0" # Specify the image name for accounts
    container_name: accounts-service  # Provide the container name to avoid random name generation
    ports:
      - "8080:8080"  # Expose the port of container to outside by port mapping
    depends_on:
      discovery-server:
        condition: service_healthy # mention the accounts service to wait till config server is completely up and running
    healthcheck:
      test: "curl --fail --silent localhost:8080/accounts-service/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: application-services-config

  loans:
    image: "manjunathgowda1992/loans:8.0.0" # Specify the image name for loans
    container_name: loans-service # Provide the container name to avoid random name generation
    ports:
      - "9000:9000"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/loans-service/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: application-services-config

  cards:
    image: "manjunathgowda1992/cards:8.0.0" # Specify the image name for cards
    container_name: cards-service  # Provide the container name to avoid random name generation
    ports:
      - "8090:8090"  # Expose the port of container to outside by port mapping
    depends_on:
      discovery-server:
        condition: service_healthy # mention the cards service to wait till config server is completely up and running
    healthcheck:
      test: "curl --fail --silent localhost:8090/cards-service/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: application-services-config

  gateway-server:
    image: "manjunathgowda1992/gateway-server:8.0.0"
    container_name: gateway-server
    ports:
      - "9100:9100"
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
    extends:
      file: common-config.yml
      service: application-services-config

# Define the network communication routes
networks:
  app-routes:
    driver: "bridge"