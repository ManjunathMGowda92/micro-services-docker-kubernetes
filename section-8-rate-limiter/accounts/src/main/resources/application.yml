eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
  retry:
    configs:
      default:
        max-attempts: 1
        wait-duration: 500
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 3000
        ignoreExceptions:
          - java.lang.NullPointerException
  ratelimiter:
    configs:
      default:
        timeout-duration: 1000  # Time duration a thread can wait for token bucket to get refreshed before it get expire
        limit-refresh-period: 5000 # Time in millis to refresh the token bucket
        limit-for-period: 1   # Number of tokens allowed for the specified period.
