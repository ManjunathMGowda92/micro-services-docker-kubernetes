server:
  port: 9010

spring:
  application:
    name: notification-service

  cloud:
    function:
      definition: email|sms
    stream:
      bindings:
        emailsms-in-0:
          destination: notification-queue
          group: ${spring.application.name}
        emailsms-out-0:
          destination: account-notification-update
      kafka:
        binder:
          brokers:
            - localhost:9092