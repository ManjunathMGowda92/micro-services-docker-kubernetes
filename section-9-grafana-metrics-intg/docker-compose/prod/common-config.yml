services:
  # Create a common service for networks which can be reused
  network-deploy-service:
    networks:
      - app-routes # Create a network communication for internal communication between services

  # Create a base config service for microservices by extending network-deploy-service
  # This will include the common configuration used by the microservices.
  microservice-base-config:
    extends:
      service: network-deploy-service
    environment:
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_USERNAME: "rabbit_prod"
      SPRING_RABBITMQ_PASSWORD: "r@bbItProd!0109"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/BOOT-INF/lib/opentelemetry-javaagent-2.20.1.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    deploy:
      resources:
        limits:
          memory: 700m # Restrict the memory usage of container to 700MB

  microservice-config-server:
    extends:
      service: microservice-base-config
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://banking-config-server:8071/"


  # Create common service for config-server environment property, which needs to be used by accounts, loans and cards.
  application-services-config:
    extends:
      service: microservice-config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_INSTANCE_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"

